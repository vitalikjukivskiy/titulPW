name: Publish approved CyberPW Assistant site

on:
  push:
    branches: [main]
    paths:
      - '_assistant-deploy/site-bundle.json.xz'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-assistant-source
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
      - name: Verify and unpack approved static site
        shell: python
        run: |
          import hashlib
          import json
          import lzma
          from pathlib import Path, PurePosixPath

          archive = Path('_assistant-deploy/site-bundle.json.xz').read_bytes()
          expected = '6b1c6f482b776c85d434267fbc071521db227de1dbb4898c356c326fe5f7e681'
          if hashlib.sha256(archive).hexdigest() != expected:
              raise SystemExit('Archive checksum mismatch; nothing published.')
          files = json.loads(lzma.decompress(archive))
          allowed = {
              '.nojekyll', 'app.js', 'assets/favicon.svg', 'content-data.js',
              'content.js', 'expanded.css', 'index.html', 'news.html',
              'site-config.js', 'styles.css', 'videos.js',
              'news/character-preview.html', 'news/craft-before-buying.html',
              'news/full-overview-september.html', 'news/macro-studio-start.html',
              'news/party-finder-preview.html', 'news/profile-market.html',
              'news/release-2-0-70.html', 'news/titles-quick-start.html',
          }
          if set(files) != allowed:
              raise SystemExit('Unexpected files; nothing published.')
          root = Path('assistant').resolve()
          for name, content in files.items():
              relative = PurePosixPath(name)
              target = (root / name).resolve()
              if relative.is_absolute() or '..' in relative.parts or root not in target.parents:
                  raise SystemExit('Unsafe path; nothing published.')
              if not isinstance(content, str):
                  raise SystemExit('Expected a UTF-8 text file.')
          for name, content in files.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content.encode('utf-8'))
          print(f'Verified {len(files)} static files. Existing title guide unchanged.')
      - name: Commit website files only
        run: |
          git add -- assistant/
          if git diff --cached --quiet; then
            echo 'Website is already up to date.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish CyberPW Assistant website with news, guides and video library'
          git push origin HEAD:main
